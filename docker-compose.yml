# FreelanceHub — backend + Postgres as containers.
#
#   1. Copy .env.example to .env and fill secrets (never commit .env).
#   2. docker compose up --build
#   3. API: http://localhost:8080 | DB: localhost:5432
#
# First boot creates the `freelancer` database automatically
# (DatabaseConfig ensureDatabaseExists). Data persists in `pgdata`.

services:
  db:
    image: postgres:18-alpine
    container_name: freelancehub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freelancer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./freelancer-backend
    container_name: freelancehub-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-freelancer}?createDatabaseIfNotExist=true
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DDL_AUTO: update
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-key-change-me-0123456789abcdef}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://*.vercel.app,http://localhost:*,http://127.0.0.1:*}

volumes:
  pgdata:
