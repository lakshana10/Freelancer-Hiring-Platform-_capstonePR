# Rebuild marker (2026-09-24): no-op comment. Railway watch paths only
# rebuild the backend when freelancer-backend/** changes, so this line
# exists to force a fresh production deploy of current main.
spring.application.name=freelancer-backend

# =====================================================
# PostgreSQL Database (all values come from the environment)
# =====================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/freelancer?createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:root@123}

# =====================================================
# JPA / Hibernate
# Schema is managed by Hibernate (ddl-auto). No SQL
# migration scripts are used in this project.
# =====================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# =====================================================
# Server
# =====================================================
server.port=${PORT:8080}
server.address=0.0.0.0

# =====================================================
# Mail (Gmail SMTP via App Password)
# Set MAIL_USERNAME to the Gmail address that created the
# App Password, and MAIL_PASSWORD to the 16-char App Password
# (spaces optional, e.g. "abcd efgh ijkl mnop").
# Never commit real credentials to git — use env vars.
# Local PowerShell:
#   $env:MAIL_USERNAME="you@gmail.com"
#   $env:MAIL_PASSWORD="abcdefghijklmnop"
# Hosting: set both as env vars (Railway: Service > Variables).
# =====================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
# Port 587 (STARTTLS) is the default. For port 465 (implicit SSL)
# set MAIL_PORT=465, MAIL_STARTTLS=false, MAIL_SMTP_SSL=true.
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME:}
# Brevo HTTPS email API (port 443). When BREVO_API_KEY is set, OTP mail
# goes via Brevo instead of Gmail SMTP (for hosts whose outbound SMTP
# is blocked, e.g. Railway). MAIL_USERNAME must then be the sender
# address verified in Brevo. BREVO_URL override exists for tests.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.brevo-url=${BREVO_URL:https://api.brevo.com/v3/smtp/email}

# =====================================================
# JWT
# Set JWT_SECRET in the environment (min 32 characters).
# A built-in default exists for local development only.
# =====================================================
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-key-change-me-0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =====================================================
# CORS (comma-separated origin patterns)
# =====================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:*,http://127.0.0.1:*}
