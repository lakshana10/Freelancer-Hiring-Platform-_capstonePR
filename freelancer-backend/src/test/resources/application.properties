# =====================================================
# Test configuration (overrides main application.properties
# on the test classpath). Uses H2 in-memory database so
# tests run without PostgreSQL. Mirrors every key from the
# main file so no placeholder is left unresolved.
# =====================================================
spring.application.name=freelancer-backend-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8080
server.address=0.0.0.0

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.jwt.secret=test-secret-key-for-unit-tests-only-0123456789abcdef
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:*
