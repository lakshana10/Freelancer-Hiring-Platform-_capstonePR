# CI gate for the Freelancer Hiring Platform.
#
# backend  -> JUnit suite (H2 in-memory, no services needed).
# frontend -> oxlint + vite build.
# e2e      -> boots the real stack (Postgres service + Spring Boot +
#             Vite dev) and runs the committed Playwright suite.
#
# Railway "Wait for CI" should point at this workflow so only green
# commits deploy to production.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend JUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freelancer-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (matches Dockerfile builder)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run JUnit suite
        run: ./mvnw -B test

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freelancer-frontend-react
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: >-
            freelancer-frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (0 errors required)
        run: npm run lint

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright E2E on live stack
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: freelancer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_BACKEND_URL: http://localhost:8080
      E2E_FRONTEND_URL: http://localhost:5174
      DATABASE_URL: >-
        jdbc:postgresql://localhost:5432/freelancer?createDatabaseIfNotExist=true
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DDL_AUTO: update
      JWT_SECRET: ci-only-secret-key-for-e2e-0123456789abcdef
      JWT_EXPIRATION_MS: 86400000
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      PORT: 8080
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: >-
            freelancer-frontend-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: freelancer-frontend-react
        run: npm ci

      - name: Install Playwright chromium
        working-directory: freelancer-frontend-react
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: freelancer-backend
        run: |
          ./mvnw -B spring-boot:run > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for i in $(seq 1 72); do
            curl -fsS http://localhost:8080/api/jobs >/dev/null && break
            sleep 5
          done
          curl -fsS http://localhost:8080/api/jobs >/dev/null

      - name: Start frontend
        working-directory: freelancer-frontend-react
        run: |
          npm run dev -- --port 5174 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 1 24); do
            curl -fsS http://localhost:5174/ >/dev/null && break
            sleep 5
          done
          curl -fsS http://localhost:5174/ >/dev/null

      - name: Run Playwright suite
        working-directory: freelancer-frontend-react
        run: npx playwright test --reporter=list

      - name: Backend log tail (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/backend.log"

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: freelancer-frontend-react/playwright-report/
          retention-days: 7
