services:
  - type: web
    name: freelancer-backend
    env: docker
    plan: free
    rootDir: freelancer-backend
    healthCheckPath: /api/jobs
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        # Render Postgres internal URL, e.g.
        # jdbc:postgresql://dpg-xxx-a/dbname
        # If you attach a Render Postgres, set this to its JDBC URL.
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DDL_AUTO
        value: update
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        # Gmail address that created the App Password.
        sync: false
      - key: MAIL_PASSWORD
        # 16-char Gmail App Password (spaces optional).
        # NEVER commit the real value — set it in Render dashboard.
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:*,http://127.0.0.1:*
