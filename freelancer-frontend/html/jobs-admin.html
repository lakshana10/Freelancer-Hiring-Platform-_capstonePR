<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelanceHub - Manage Jobs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fafaff;
            color: #10152f;
        }

        .navbar {
            min-height: 72px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            border-bottom: 1px solid #eeeeee;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
        }

        .logo-icon {
            color: #6841e8;
            font-size: 34px;
        }

        .logo span span {
            color: #6841e8;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-label {
            background: #eee7ff;
            color: #6841e8;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .back-btn,
        .logout-btn {
            background: white;
            border: 1px solid #ddd;
            color: #33384d;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn:hover,
        .logout-btn:hover {
            border-color: #6841e8;
            color: #6841e8;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 45px 0 70px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header small {
            color: #7044ee;
            font-weight: 700;
            font-size: 12px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #777;
            font-size: 15px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border: 1px solid #e8e6ee;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(30, 20, 70, 0.04);
        }

        .summary-card small {
            color: #777;
            font-size: 12px;
        }

        .summary-card h2 {
            font-size: 27px;
            margin-top: 7px;
        }

        .jobs-box {
            background: white;
            border: 1px solid #e8e6ee;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(30, 20, 70, 0.04);
        }

        .jobs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .jobs-header h2 {
            font-size: 22px;
        }

        .refresh-btn {
            background: #6841e8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .refresh-btn:hover {
            background: #512bd4;
        }

        .job-card {
            border: 1px solid #e8e6ee;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .job-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(80, 50, 160, 0.08);
        }

        .job-card:last-child {
            margin-bottom: 0;
        }

        .job-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .job-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .job-description {
            color: #777;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .job-details {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .job-detail {
            background: #f7f5ff;
            color: #555;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 12px;
        }

        .status {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-open {
            background: #e6f8ef;
            color: #27a765;
        }

        .status-closed {
            background: #ffe7e7;
            color: #d64545;
        }

        .status-pending {
            background: #fff0dc;
            color: #e99731;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 35px;
            color: #777;
        }

        .error {
            color: #d64545;
        }

        .footer {
            text-align: center;
            padding: 25px;
            background: white;
            border-top: 1px solid #eeeeee;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 15px 4%;
                flex-direction: column;
                gap: 15px;
            }

            .nav-right {
                flex-wrap: wrap;
                justify-content: center;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .jobs-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .job-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <div class="logo-icon">◆</div>
            <span>Freelance<span>Hub</span></span>
        </div>

        <div class="nav-right">
            <span class="admin-label">ADMIN</span>

            <button class="back-btn" onclick="goDashboard()">
                Dashboard
            </button>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>
        </div>

    </nav>


    <main class="container">

        <div class="page-header">
            <small>ADMIN PANEL</small>

            <h1>Manage Jobs</h1>

            <p>
                View and monitor all jobs posted on FreelanceHub.
            </p>
        </div>


        <section class="summary">

            <div class="summary-card">
                <small>TOTAL JOBS</small>
                <h2 id="totalJobs">0</h2>
            </div>

            <div class="summary-card">
                <small>OPEN JOBS</small>
                <h2 id="openJobs">0</h2>
            </div>

        </section>


        <section class="jobs-box">

            <div class="jobs-header">

                <h2>All Jobs</h2>

                <button class="refresh-btn" onclick="loadJobs()">
                    Refresh
                </button>

            </div>

            <div id="jobsContainer">
                <div class="loading">
                    Loading jobs...
                </div>
            </div>

        </section>

    </main>


    <footer class="footer">
        © 2026 FreelanceHub. Admin Panel.
    </footer>


    <script>

        /* ================= ADMIN PROTECTION ================= */

        const loggedInUser =
            JSON.parse(localStorage.getItem("loggedInUser"));

        if (
            !loggedInUser ||
            !loggedInUser.role ||
            loggedInUser.role.toUpperCase() !== "ADMIN"
        ) {
            alert("Access denied! Admins only.");
            window.location.href = "login.html";
        }


        /* ================= DASHBOARD ================= */

        function goDashboard() {
            window.location.href = "admin.html";
        }


        /* ================= LOGOUT ================= */

        function logout() {
            localStorage.removeItem("loggedInUser");
            window.location.href = "login.html";
        }


        /* ================= LOAD JOBS ================= */

        async function loadJobs() {

            const container =
                document.getElementById("jobsContainer");

            try {

                const response =
                    await fetch("https://freelancer-backend-9cw6.onrender.com/api/jobs");

                if (!response.ok) {
                    throw new Error("Job API not available");
                }

                const jobs = await response.json();

                document.getElementById("totalJobs").textContent =
                    jobs.length;

                const openCount =
                    jobs.filter(job =>
                        String(job.status || "")
                            .toUpperCase() === "OPEN"
                    ).length;

                document.getElementById("openJobs").textContent =
                    openCount;


                if (jobs.length === 0) {

                    container.innerHTML = `
                        <div class="empty">
                            No jobs found.
                        </div>
                    `;

                    return;
                }


                container.innerHTML = "";

                jobs.forEach(job => {

                    const status =
                        String(job.status || "OPEN")
                            .toUpperCase();

                    let statusClass = "status-pending";

                    if (status === "OPEN") {
                        statusClass = "status-open";
                    }

                    if (status === "CLOSED") {
                        statusClass = "status-closed";
                    }


                    const card = document.createElement("div");

                    card.className = "job-card";

                    card.innerHTML = `
                        <div class="job-top">

                            <div>

                                <div class="job-title">
                                    ${job.title || "Untitled Job"}
                                </div>

                                <div class="job-description">
                                    ${job.description || "No description available."}
                                </div>

                            </div>

                            <span class="status ${statusClass}">
                                ${status}
                            </span>

                        </div>

                        <div class="job-details">

                            <span class="job-detail">
                                Job ID: ${job.id ?? "N/A"}
                            </span>

                            <span class="job-detail">
                                Budget: ₹${job.budget ?? "Not specified"}
                            </span>

                        </div>
                    `;

                    container.appendChild(card);

                });

            } catch (error) {

                console.error(error);

                document.getElementById("totalJobs").textContent = "0";
                document.getElementById("openJobs").textContent = "0";

                container.innerHTML = `
                    <div class="error">
                        Job API not available yet.
                        <br><br>
                        Please make sure the backend is running.
                    </div>
                `;
            }
        }


        /* ================= START ================= */

        loadJobs();

    </script>

</body>
</html>
