<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Client Contracts - FreelanceHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fc;
            color: #11152b;
        }

        /* NAVBAR */

        .contract-navbar {
            background: #11152b;
            color: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .contract-logo {
            font-size: 24px;
            font-weight: bold;
        }

        .contract-nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .contract-nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .contract-nav-links a:hover {
            color: #aab4ff;
        }

        /* PAGE */

        .page-header {
            text-align: center;
            padding: 45px 20px 25px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
            font-size: 15px;
        }

        /* CONTRACT CONTAINER */

        .contracts-container {
            width: 90%;
            max-width: 1100px;
            margin: 20px auto 60px;
        }

        /* CONTRACT CARD */

        .contract-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .contract-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .contract-title-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .contract-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #eef0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .contract-title-section h3 {
            font-size: 19px;
            margin-bottom: 5px;
        }

        .contract-number {
            color: #777;
            font-size: 13px;
        }

        /* STATUS */

        .status {
            background: #eaf8ef;
            color: #198754;
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #198754;
            display: inline-block;
            border-radius: 50%;
            margin-right: 5px;
        }

        /* DETAILS */

        .contract-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .detail-box {
            background: #f7f8fc;
            padding: 15px;
            border-radius: 10px;
        }

        .detail-label {
            display: block;
            color: #777;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .detail-value {
            display: block;
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        /* FOOTER */

        .contract-footer {
            border-top: 1px solid #eee;
            padding-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .contract-info {
            color: #777;
            font-size: 13px;
        }

        .contract-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* BUTTONS */

        .details-btn,
        .review-btn,
        .jobs-btn {
            border: none;
            padding: 10px 17px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .details-btn {
            background: #eef0ff;
            color: #11152b;
        }

        .details-btn:hover {
            background: #dfe3ff;
        }

        .review-btn {
            background: #f59e0b;
            color: white;
        }

        .review-btn:hover {
            background: #d97706;
        }

        .jobs-btn {
            background: #11152b;
            color: white;
        }

        .jobs-btn:hover {
            background: #252b4d;
        }

        /* EMPTY */

        .no-contracts {
            background: white;
            text-align: center;
            padding: 60px 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .no-contracts h2 {
            margin-bottom: 10px;
        }

        .no-contracts p {
            color: #777;
            margin-bottom: 20px;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .contract-navbar {
                padding: 18px 25px;
            }

            .contract-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .contract-footer {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 550px) {

            .contract-nav-links {
                gap: 12px;
            }

            .contract-nav-links a {
                font-size: 12px;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .contract-details {
                grid-template-columns: 1fr;
            }

            .contract-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .contract-actions {
                width: 100%;
            }

            .details-btn,
            .review-btn {
                flex: 1;
            }
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="contract-navbar">

        <div class="contract-logo">
            FreelanceHub
        </div>

        <div class="contract-nav-links">

            <a href="home.html">Home</a>

            <a href="jobs.html">Find Jobs</a>

            <a href="client-applications.html">
                My Applications
            </a>

            <a href="client-contracts.html">
                My Contracts
            </a>

            <a href="my-payments.html">
                My Payments
            </a>

            <a href="my-profile.html">
                My Profile
            </a>

        </div>

    </nav>


    <!-- PAGE HEADER -->

    <section class="page-header">

        <h1>My Client Contracts</h1>

        <p>
            Manage your contracts and review completed work.
        </p>

    </section>


    <!-- CONTRACTS -->

    <main class="contracts-container" id="contractsContainer">

        <div class="no-contracts">

            <div class="empty-icon">
                ⏳
            </div>

            <h2>Loading Contracts...</h2>

            <p>
                Please wait while your contracts are loaded.
            </p>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="../js/client-contracts.js"></script>

</body>

</html>
