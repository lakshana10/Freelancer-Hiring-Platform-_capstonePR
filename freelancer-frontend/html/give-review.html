<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Give Review - FreelanceHub</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .review-page {
            min-height: 75vh;
            padding: 60px 20px;
            background: #f6f8fc;
        }

        .review-box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .review-box h1 {
            margin-bottom: 8px;
            color: #172554;
        }

        .review-box .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .contract-info {
            background: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .contract-info p {
            margin: 7px 0;
            color: #475569;
        }

        .contract-info strong {
            color: #172554;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        .star-rating {
            display: flex;
            gap: 8px;
            font-size: 34px;
        }

        .star-rating span {
            cursor: pointer;
            color: #cbd5e1;
            transition: 0.2s;
        }

        .star-rating span.selected {
            color: #f59e0b;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            resize: vertical;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .submit-review-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-review-btn:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .review-box {
                padding: 25px 20px;
            }
        }
    </style>
<script src="../js/auth.js"></script>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <span class="logo-icon">✣</span>
            <span>Freelance<span>Hub</span></span>
        </div>

        <nav>
            <a href="home.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="my-applications.html">My Applications</a>
            <a href="my-jobs.html">My Jobs</a>
            <a href="my-contracts.html">My Contracts</a>
            <a href="my-payments.html">My Payments</a>
            <a href="my-reviews.html">My Reviews</a>
            <a href="profile.html">My Profile</a>
            <a href="freelancers.html">Freelancers</a>
        </nav>

        <div class="nav-actions">
            <button class="icon-btn" id="themeBtn">☾</button>
            <button class="login-btn" onclick="window.location.href='login.html'">
                Login
            </button>
            <button class="signup-btn" onclick="window.location.href='signup.html'">
                Sign Up →
            </button>
        </div>

    </header>


    <!-- REVIEW SECTION -->
    <main class="review-page">

        <div class="review-box">

            <h1>Give a Review ⭐</h1>

            <p class="subtitle">
                Share your experience with the freelancer.
            </p>

            <div class="contract-info">

                <p>
                    <strong>Job:</strong>
                    <span id="jobTitle">Loading...</span>
                </p>

                <p>
                    <strong>Freelancer:</strong>
                    <span id="freelancerEmail">Loading...</span>
                </p>

                <p>
                    <strong>Contract ID:</strong>
                    #<span id="contractId">Loading...</span>
                </p>

            </div>


            <div class="form-group">

                <label>Rating</label>

                <div class="star-rating">

                    <span data-rating="1">★</span>
                    <span data-rating="2">★</span>
                    <span data-rating="3">★</span>
                    <span data-rating="4">★</span>
                    <span data-rating="5">★</span>

                </div>

            </div>


            <div class="form-group">

                <label for="comment">
                    Your Review
                </label>

                <textarea
                    id="comment"
                    placeholder="Write your experience with the freelancer..."
                ></textarea>

            </div>


            <button
                class="submit-review-btn"
                onclick="submitReview()"
            >
                Submit Review
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </div>

    </main>


    <script src="../js/give-review.js"></script>

</body>
</html>
