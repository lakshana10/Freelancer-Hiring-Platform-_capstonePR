<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | FreelanceHub</title>

    <link
        rel="stylesheet"
        href="../css/signup.css"
    >

</head>


<body>


    <!-- ===============================
         TOP LOGO
    ================================ -->

    <header class="signup-header">

        <a
            href="index.html"
            class="logo"
        >

            <span class="logo-icon">
                ✦
            </span>

            <span>
                Freelance<span>Hub</span>
            </span>

        </a>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Home
        </a>

    </header>



    <!-- ===============================
         SIGNUP SECTION
    ================================ -->

    <main class="signup-section">

        <div class="signup-card">


            <!-- Icon -->

            <div class="signup-icon">
                ✦
            </div>


            <h1>
                Create your account
            </h1>


            <p class="subtitle">
                Join FreelanceHub and start your journey today.
            </p>



            <!-- ===============================
                 SIGNUP FORM
            ================================ -->

            <form id="signupForm">


                <!-- Full Name -->

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- ===============================
                     OTP
                ================================ -->

                <div class="input-group">

                    <label for="otp">
                        Email Verification OTP
                    </label>


                    <div class="otp-box">

                        <input
                            type="text"
                            id="otp"
                            placeholder="Enter 6-digit OTP"
                            maxlength="6"
                            inputmode="numeric"
                        >


                        <button
                            type="button"
                            id="generateOtpBtn"
                        >
                            Get OTP
                        </button>

                    </div>


                    <button
                        type="button"
                        id="verifyOtpBtn"
                        class="verify-otp-btn"
                    >
                        Verify OTP
                    </button>


                    <p
                        id="otpMessage"
                        class="otp-message"
                    ></p>

                </div>



                <!-- ===============================
                     JOIN AS
                ================================ -->

                <div class="input-group">

                    <label>
                        I want to join as
                    </label>


                    <div class="role-selection">


                        <!-- Freelancer -->

                        <label class="role-card">

                            <input
                                type="radio"
                                name="role"
                                value="FREELANCER"
                            >

                            <div class="role-content">

                                <div class="role-icon">
                                    👩‍💻
                                </div>

                                <div class="role-info">

                                    <h3>
                                        Freelancer
                                    </h3>

                                    <p>
                                        Find projects, showcase your skills
                                        and earn money.
                                    </p>

                                </div>

                                <div class="role-check">
                                    ✓
                                </div>

                            </div>

                        </label>



                        <!-- Client -->

                        <label class="role-card">

                            <input
                                type="radio"
                                name="role"
                                value="CLIENT"
                            >

                            <div class="role-content">

                                <div class="role-icon">
                                    💼
                                </div>

                                <div class="role-info">

                                    <h3>
                                        Client
                                    </h3>

                                    <p>
                                        Post jobs, find skilled freelancers
                                        and hire easily.
                                    </p>

                                </div>

                                <div class="role-check">
                                    ✓
                                </div>

                            </div>

                        </label>


                    </div>

                </div>



                <!-- Password -->

                <div class="input-group">

                    <div class="label-row">

                        <label for="password">
                            Password
                        </label>

                    </div>


                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>



                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmPassword', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>



                <!-- Terms -->

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >


                    <label for="terms">

                        I agree to the

                        <a href="#">
                            Terms & Conditions
                        </a>

                        and

                        <a href="#">
                            Privacy Policy
                        </a>

                    </label>

                </div>



                <!-- Create Account -->

                <button
                    type="submit"
                    class="create-btn"
                    id="createAccountBtn"
                >

                    Create Account

                    <span>
                        →
                    </span>

                </button>


            </form>



            <!-- ===============================
                 LOGIN
            ================================ -->

            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </div>

    </main>



    <!-- ===============================
         FOOTER
    ================================ -->

    <footer>

        © 2026 FreelanceHub. All rights reserved.

    </footer>



    <!-- ===============================
         EMAILJS
    ================================ -->

    <script
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>


    <script>

        emailjs.init({

            publicKey:
                "KQVvB6pYo4npQWly9"

        });

    </script>



    <!-- ===============================
         SIGNUP JAVASCRIPT
    ================================ -->

    <script src="../js/signup.js"></script>


</body>

</html>
