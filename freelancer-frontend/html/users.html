<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FreelanceHub - Manage Users</title>

    <style>

        /* ================= GLOBAL ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fafaff;
            color: #10152f;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            height: 72px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            border-bottom: 1px solid #eeeeee;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
        }

        .logo-icon {
            color: #6841e8;
            font-size: 34px;
        }

        .logo span span {
            color: #6841e8;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-label {
            background: #eee7ff;
            color: #6841e8;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .back-btn,
        .logout-btn {
            background: white;
            border: 1px solid #ddd;
            color: #33384d;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn:hover,
        .logout-btn:hover {
            border-color: #6841e8;
            color: #6841e8;
        }


        /* ================= MAIN ================= */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 45px 0 70px;
        }


        /* ================= HEADER ================= */

        .page-header {
            margin-bottom: 30px;
        }

        .page-header small {
            color: #7044ee;
            font-weight: 700;
            font-size: 12px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #777;
            font-size: 15px;
        }


        /* ================= SUMMARY ================= */

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border: 1px solid #e8e6ee;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(30, 20, 70, 0.04);
        }

        .summary-card small {
            color: #777;
            font-size: 12px;
        }

        .summary-card h2 {
            font-size: 27px;
            margin-top: 7px;
        }


        /* ================= TABLE BOX ================= */

        .table-box {
            background: white;
            border: 1px solid #e8e6ee;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(30, 20, 70, 0.04);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .table-header h2 {
            font-size: 22px;
        }

        .refresh-btn {
            background: #6841e8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .refresh-btn:hover {
            background: #512bd4;
        }


        /* ================= TABLE ================= */

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            text-align: left;
            background: #f7f5ff;
            color: #555;
            font-size: 13px;
            padding: 15px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eeeeee;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #faf9ff;
        }


        /* ================= ROLE ================= */

        .role {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .role-freelancer {
            background: #e6f8ef;
            color: #27a765;
        }

        .role-client {
            background: #e7f1ff;
            color: #3974e8;
        }

        .role-admin {
            background: #eee8ff;
            color: #6841e8;
        }


        /* ================= LOADING ================= */

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .error {
            text-align: center;
            padding: 25px;
            color: #d33;
            background: #fff1f1;
            border-radius: 10px;
        }


        /* ================= FOOTER ================= */

        footer {
            text-align: center;
            padding: 35px;
            background: #17132d;
            color: white;
        }

        .footer-logo {
            font-size: 22px;
            font-weight: bold;
            color: #a88cff;
            margin-bottom: 10px;
        }

        footer p {
            color: #aaa;
            font-size: 13px;
            margin: 5px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .navbar {
                height: auto;
                padding: 15px 5%;
                flex-wrap: wrap;
                gap: 12px;
            }

            .nav-right {
                width: 100%;
                justify-content: flex-end;
            }

            .container {
                padding-top: 30px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .table-box {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">

            <span class="logo-icon">✣</span>

            <span>
                Freelance<span>Hub</span>
            </span>

        </div>


        <div class="nav-right">

            <div class="admin-label">
                Administrator
            </div>

            <button
                class="back-btn"
                onclick="goBack()">

                ← Dashboard

            </button>

            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- PAGE HEADER -->

        <section class="page-header">

            <small>
                USER MANAGEMENT
            </small>

            <h1>
                Manage Users
            </h1>

            <p>
                View all registered FreelanceHub users and their roles.
            </p>

        </section>



        <!-- ================= SUMMARY ================= -->

        <section class="summary">


            <div class="summary-card">

                <small>
                    TOTAL USERS
                </small>

                <h2 id="totalUsers">
                    0
                </h2>

            </div>


            <div class="summary-card">

                <small>
                    FREELANCERS
                </small>

                <h2 id="totalFreelancers">
                    0
                </h2>

            </div>


            <div class="summary-card">

                <small>
                    CLIENTS
                </small>

                <h2 id="totalClients">
                    0
                </h2>

            </div>


        </section>



        <!-- ================= USERS TABLE ================= -->

        <section class="table-box">


            <div class="table-header">

                <h2>
                    Registered Users
                </h2>

                <button
                    class="refresh-btn"
                    onclick="loadUsers()">

                    ↻ Refresh

                </button>

            </div>


            <div id="tableContainer">

                <div class="loading">
                    Loading users...
                </div>

            </div>


        </section>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-logo">
            ✣ FreelanceHub
        </div>

        <p>
            Connect. Collaborate. Create.
        </p>

        <p>
            © 2026 FreelanceHub. All rights reserved.
        </p>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* =========================================
           ADMIN ACCESS PROTECTION
        ========================================= */

        const loggedInUser =
            JSON.parse(localStorage.getItem("loggedInUser"));


        if (
            !loggedInUser ||
            !loggedInUser.role ||
            loggedInUser.role.toUpperCase() !== "ADMIN"
        ) {

            alert("Access denied! Admins only.");

            window.location.href = "login.html";

        }



        /* =========================================
           LOAD USERS
        ========================================= */

        async function loadUsers() {

            const tableContainer =
                document.getElementById("tableContainer");


            tableContainer.innerHTML = `
                <div class="loading">
                    Loading users...
                </div>
            `;


            try {

                const response =
                    await fetch(
                        "https://freelancer-backend-9cw6.onrender.com/api/users"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to fetch users"
                    );

                }


                const users =
                    await response.json();


                /* ================================
                   COUNTS
                ================================= */

                const freelancers =
                    users.filter(
                        user =>
                            user.role &&
                            user.role.toUpperCase() === "FREELANCER"
                    ).length;


                const clients =
                    users.filter(
                        user =>
                            user.role &&
                            user.role.toUpperCase() === "CLIENT"
                    ).length;


                document.getElementById("totalUsers")
                    .textContent = users.length;


                document.getElementById("totalFreelancers")
                    .textContent = freelancers;


                document.getElementById("totalClients")
                    .textContent = clients;



                /* ================================
                   EMPTY USERS
                ================================= */

                if (users.length === 0) {

                    tableContainer.innerHTML = `
                        <div class="loading">
                            No users found.
                        </div>
                    `;

                    return;
                }



                /* ================================
                   CREATE TABLE
                ================================= */

                let tableHTML = `

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Name</th>

                                <th>Email</th>

                                <th>Role</th>

                            </tr>

                        </thead>

                        <tbody>
                `;


                users.forEach(user => {


                    let roleClass =
                        "role-freelancer";


                    if (
                        user.role &&
                        user.role.toUpperCase() === "CLIENT"
                    ) {

                        roleClass =
                            "role-client";

                    }


                    if (
                        user.role &&
                        user.role.toUpperCase() === "ADMIN"
                    ) {

                        roleClass =
                            "role-admin";

                    }


                    tableHTML += `

                        <tr>

                            <td>
                                ${user.id}
                            </td>

                            <td>
                                ${user.name}
                            </td>

                            <td>
                                ${user.email}
                            </td>

                            <td>

                                <span class="role ${roleClass}">
                                    ${user.role || "N/A"}
                                </span>

                            </td>

                        </tr>

                    `;

                });


                tableHTML += `

                        </tbody>

                    </table>

                `;


                tableContainer.innerHTML =
                    tableHTML;


                console.log(
                    "Users loaded successfully:",
                    users
                );


            } catch (error) {

                console.error(
                    "Error loading users:",
                    error
                );


                tableContainer.innerHTML = `

                    <div class="error">

                        Unable to load users.

                        <br><br>

                        Make sure the Spring Boot
                        backend is running.

                    </div>

                `;

            }

        }



        /* =========================================
           BACK TO DASHBOARD
        ========================================= */

        function goBack() {

            window.location.href =
                "admin.html";

        }



        /* =========================================
           LOGOUT
        ========================================= */

        function logout() {

            localStorage.removeItem(
                "loggedInUser"
            );

            window.location.href =
                "login.html";

        }



        /* =========================================
           LOAD USERS WHEN PAGE OPENS
        ========================================= */

        loadUsers();


    </script>


</body>

</html>
