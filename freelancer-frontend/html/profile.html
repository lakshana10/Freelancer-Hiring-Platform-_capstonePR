<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - FreelanceHub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span class="logo-icon">✣</span>
        <span>Freelance<span>Hub</span></span>
    </div>

    <nav>
        <a href="home.html">Home</a>
        <a href="jobs.html">Find Jobs</a>
        <a href="my-applications.html">My Applications</a>
        <a href="my-jobs.html">My Jobs</a>
        <a href="freelancers.html">Freelancers</a>
    </nav>

    <div class="nav-actions">

        <button class="icon-btn" id="themeBtn">☾</button>

        <button
            class="login-btn"
            onclick="window.location.href='login.html'">
            Login
        </button>

        <button
            class="signup-btn"
            onclick="window.location.href='signup.html'">
            Sign Up →
        </button>

    </div>

</header>


<section class="profile-page">

    <div class="page-header">

        <h1>My Profile</h1>

        <p>Update your freelancer profile.</p>

    </div>

    <div class="profile-form">

        <label>Skills</label>
        <input
            type="text"
            id="skills"
            placeholder="Java, HTML, CSS, JavaScript">

        <label>Experience</label>
        <input
            type="text"
            id="experience"
            placeholder="1 Year">

        <label>Bio</label>
        <textarea
            id="bio"
            rows="5"
            placeholder="Tell clients about yourself"></textarea>

        <button onclick="updateProfile()">
            Save Profile
        </button>

        <p id="message"></p>

    </div>

</section>


<footer>

    <div class="footer-logo">
        ✣ FreelanceHub
    </div>

    <p>Connect. Collaborate. Create.</p>

    <p>© 2026 FreelanceHub. All rights reserved.</p>

</footer>


<script src="../js/profile.js"></script>

</body>

</html>
