<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Payments - FreelanceHub</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <style>

        body {
            background: #f6f8fc;
        }


        /* ================= PAGE ================= */

        .payments-container {
            max-width: 1150px;
            margin: 45px auto;
            padding: 0 20px 50px;
        }


        /* ================= HEADER ================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .header-text h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .header-text p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }

        .payment-header-icon {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: #eaf0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }


        /* ================= SUMMARY ================= */

        .payment-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            border: 1px solid #eef0f5;
        }

        .summary-label {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 25px;
            font-weight: 700;
        }


        /* ================= PAYMENT CARD ================= */

        .payment-card {
            background: white;
            padding: 26px;
            margin-bottom: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.07);
            border: 1px solid #edf0f5;
            transition: 0.2s ease;
        }

        .payment-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.10);
        }


        /* ================= TOP ================= */

        .payment-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .payment-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .payment-icon {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: #eef3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .payment-title h3 {
            margin: 0 0 6px;
            font-size: 19px;
        }

        .payment-number {
            color: #888;
            font-size: 13px;
        }


        /* ================= STATUS ================= */

        .payment-status {
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
        }

        .payment-status.paid {
            background: #e8f8ee;
            color: #198754;
        }

        .payment-status.pending {
            background: #fff4d6;
            color: #996c00;
        }


        /* ================= DETAILS ================= */

        .payment-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .detail-box {
            background: #f8f9fc;
            padding: 17px;
            border-radius: 11px;
        }

        .detail-label {
            display: block;
            color: #777;
            font-size: 12px;
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .detail-value {
            display: block;
            font-weight: 600;
            font-size: 14px;
            word-break: break-word;
        }

        .amount {
            font-size: 24px;
        }


        /* ================= FOOTER ================= */

        .payment-footer {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #edf0f3;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .payment-id {
            color: #777;
            font-size: 14px;
        }


        /* ================= BUTTON ================= */

        .pay-btn {
            border: none;
            padding: 12px 22px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
            background: #1f4ed8;
            color: white;
            transition: 0.2s ease;
        }

        .pay-btn:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }


        /* ================= EMPTY ================= */

        .no-payments {
            background: white;
            border-radius: 16px;
            padding: 70px 20px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .no-payments h2 {
            margin-bottom: 10px;
        }

        .no-payments p {
            color: #666;
            max-width: 450px;
            margin: 0 auto 22px;
        }

        .jobs-btn {
            display: inline-block;
            padding: 11px 22px;
            border-radius: 9px;
            text-decoration: none;
            background: #1f4ed8;
            color: white;
            font-weight: 700;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .page-header {
                align-items: flex-start;
            }

            .payment-summary {
                grid-template-columns: 1fr;
            }

            .payment-details {
                grid-template-columns: 1fr;
            }

            .payment-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .payment-footer {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">
            FreelanceHub
        </div>

        <div class="nav-links">

            <a href="home.html">
                Home
            </a>

            <a href="jobs.html">
                Find Jobs
            </a>

            <a href="my-applications.html">
                My Applications
            </a>

            <a href="my-jobs.html">
                My Jobs
            </a>

            <a href="my-contracts.html">
                My Contracts
            </a>

            <a href="my-payments.html">
                My Payments
            </a>

            <a href="profile.html">
                My Profile
            </a>

            <a href="freelancers.html">
                Freelancers
            </a>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <div class="payments-container">


        <!-- HEADER -->

        <div class="page-header">

            <div class="header-text">

                <h1>
                    My Payments
                </h1>

                <p>
                    Track your freelance payments and transactions.
                </p>

            </div>


            <div class="payment-header-icon">
                💳
            </div>

        </div>


        <!-- SUMMARY -->

        <div
            id="paymentSummary"
            class="payment-summary">

        </div>


        <!-- PAYMENTS -->

        <div id="paymentsContainer">

            <div class="no-payments">

                <div class="empty-icon">
                    💳
                </div>

                <h2>
                    Loading Payments...
                </h2>

            </div>

        </div>


    </div>


    <script src="../js/my-payments.js"></script>


</body>

</html>
