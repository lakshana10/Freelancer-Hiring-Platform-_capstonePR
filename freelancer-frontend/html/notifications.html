<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notifications - FreelanceHub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #0b1f3a;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 9px 16px;
            border: 1px solid white;
            border-radius: 6px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .notification {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .notification.unread {
            border-left: 5px solid #2563eb;
        }

        .message {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .date {
            font-size: 13px;
            color: #6b7280;
        }

        .read-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .read-btn:hover {
            background: #1d4ed8;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            color: #6b7280;
        }

    </style>

<script src="../js/auth.js"></script>
</head>


<body>

    <div class="navbar">

        <div class="logo">
            FreelanceHub
        </div>

        <a href="home.html"
           class="back-btn">
            Home
        </a>

    </div>


    <div class="container">

        <h1>🔔 Notifications</h1>

        <div id="notificationsContainer">

            <div class="empty">
                Loading notifications...
            </div>

        </div>

    </div>


    <script src="../js/notifications.js"></script>

</body>

</html>
